name: CI

# PRs + main only, deliberately. No docs-only fast path: Markdown is the product here.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Frontmatter, JSON, YAML, shellcheck, hook simulation, links
        run: scripts/check.sh
      - name: Skills CLI discovers both skills
        run: |
          out=$(npx --yes skills@1.7.4 add . -l 2>&1)
          echo "$out"
          for skill in agentic-setup pr; do
            grep -qw "$skill" <<<"$out" || { echo "skill $skill not listed"; exit 1; }
          done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
