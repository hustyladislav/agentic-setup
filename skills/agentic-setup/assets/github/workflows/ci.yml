name: CI

# PRs + main only, deliberately.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # a PR checks out its merge commit; HEAD^1 is the base tip
      - name: Scope
        id: scope
        # Markdown, agent config and the skills lockfile feed no build or runtime path: report the required check as a pass.
        # Portable (BSD + GNU grep): any path NOT matching the docs pattern means code changed.
        run: |
          files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$files" ] \
            && ! printf '%s\n' "$files" | grep -vE '(\.md$|^\.claude/|^\.agents/|^skills-lock\.json$)' | grep -q .; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs/agent-config-only change — nothing to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/pnpm
        if: steps.scope.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.code == 'true'
        run: pnpm verify # replace with the repo's verify script
      - if: steps.scope.outputs.code == 'true'
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Scope
        id: scope
        run: |
          files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$files" ] \
            && ! printf '%s\n' "$files" | grep -vE '(\.md$|^\.claude/|^\.agents/|^skills-lock\.json$)' | grep -q .; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/pnpm
        if: steps.scope.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - if: steps.scope.outputs.code == 'true'
        run: pnpm e2e # delete this job if the repo has no e2e suite

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
